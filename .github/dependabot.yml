version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Next.js is pinned: @opennextjs/cloudflare must support a Next release before we move.
      # Upgrade Next and @opennextjs/cloudflare together, by hand, and check CI.
      - dependency-name: next
        update-types: [version-update:semver-minor, version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
